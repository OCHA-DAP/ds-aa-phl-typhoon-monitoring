name: Monitor CMA typhoon bulletins

on:
  schedule:
    # CMA issues on a 3-hourly cycle: bulletins cluster at 02, 05, 08, 11,
    # 14, 17, 20 and 23 UTC, which together carry about 60% of the feed.
    # The rest are corrections and re-issues that land at any hour, and the
    # median gap between consecutive bulletins for an active storm is under
    # 40 minutes. Polling every 15 minutes therefore catches both the cycle
    # and the off-cycle re-issues, without depending on GitHub cron being
    # punctual (it is best effort and can run late under load).
    #
    # Idle polls are cheap: the monitoring log records which bulletins have
    # been processed, and the WorldPop raster is only loaded once a storm
    # actually approaches.
    - cron: '*/15 * * * *'

  # Lets the CMA FTP sync notify this repo the moment a bulletin lands,
  # rather than waiting for the next poll. Trigger it with a POST to
  # /repos/OCHA-DAP/ds-aa-phl-typhoon-monitoring/dispatches carrying
  # {"event_type": "cma-bulletin"}.
  repository_dispatch:
    types: [cma-bulletin]

  workflow_dispatch:
    inputs:
      blob:
        description: 'Process one specific bulletin blob'
        required: false
        default: ''
      since:
        description: 'Poll from this UTC time (YYYY-MM-DDTHH:MM)'
        required: false
        default: ''
      test:
        description: 'Send to the test list with a [TEST] subject prefix'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Compute only, send no email and write nothing to blob'
        required: false
        type: boolean
        default: false

concurrency:
  # Never let two polls process the same bulletin at once, which would
  # double-send. A queued run waits rather than being cancelled, so a
  # bulletin is not skipped.
  group: monitor-cma
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Keep schedule alive
        run: echo "Workflow keep-alive ping at $(date -u)"

  run-monitoring:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.4'
          cache: 'pip'

      - name: Install dependencies
        # pip's vendored truststore raises an unhandled AttributeError when a
        # TLS connection drops mid-handshake, which failed two runs on
        # 2026-09-06. Retries turn that transient into a delay rather than a
        # failed run; the outer retry covers the case where pip's own retries
        # are exhausted.
        env:
          PIP_RETRIES: "5"
          PIP_TIMEOUT: "30"
        run: |
          install_all() {
            python -m pip install --upgrade pip || return 1
            python -m pip install -e . || return 1
            python -m pip install -r requirements.txt || return 1
          }
          for attempt in 1 2 3; do
            if install_all; then
              exit 0
            fi
            echo "dependency install failed (attempt $attempt), retrying"
            sleep $((attempt * 15))
          done
          echo "dependency install failed after 3 attempts"
          exit 1

      - name: Run monitoring
        env:
          # Workflow inputs go through the environment rather than being
          # interpolated into the shell, so a value containing quotes or
          # semicolons cannot alter the command.
          INPUT_BLOB: ${{ github.event.inputs.blob }}
          INPUT_SINCE: ${{ github.event.inputs.since }}
          INPUT_TEST: ${{ github.event.inputs.test }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          DSCI_AZ_BLOB_DEV_SAS_WRITE: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS_WRITE }}
          DSCI_AZ_BLOB_DEV_SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
          DSCI_AZ_BLOB_PROD_SAS: ${{ secrets.DSCI_AZ_BLOB_PROD_SAS }}
          DSCI_LISTMONK_API_URL: ${{ secrets.DSCI_LISTMONK_API_URL }}
          DSCI_LISTMONK_API_USERNAME: ${{ secrets.DSCI_LISTMONK_API_USERNAME }}
          DSCI_LISTMONK_API_KEY: ${{ secrets.DSCI_LISTMONK_API_KEY }}
        run: |
          ARGS=()
          if [ -n "$INPUT_BLOB" ]; then ARGS+=(--blob "$INPUT_BLOB"); fi
          if [ -n "$INPUT_SINCE" ]; then ARGS+=(--since "$INPUT_SINCE"); fi
          # Scheduled runs send to the live distribution list. To put
          # unattended runs back on the test list, add:
          #   if [ "$EVENT_NAME" = "schedule" ]; then ARGS+=(--test); fi
          if [ "$INPUT_TEST" = "true" ]; then ARGS+=(--test); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python pipelines/monitor_cma.py "${ARGS[@]}"
